<!doctype html>
<!-- Source for public/local/og.png, the link-preview card for /local. Rebuild with: npm run og:local -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Besley:ital,wght@1,400&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #EAE7DE; color: #1A1613;
    font-family: 'Bricolage Grotesque', sans-serif;
    padding: 64px 72px 56px;
    position: relative;
  }
  body::before { content: ''; position: absolute; left: 72px; right: 72px; top: 40px; height: 4px; background: #1A1613; }
  .flag { font-family: 'Besley', serif; font-style: italic; font-size: 26px; color: #6A6256; margin-top: 8px; }
  h1 { font-weight: 800; font-size: 100px; line-height: .98; letter-spacing: -.045em; margin: 22px 0 0; }
  .mark { position: relative; white-space: nowrap; }
  .mark svg { position: absolute; left: -2%; width: 104%; bottom: -8px; height: 26px; overflow: visible; }
  .mark path { fill: none; stroke: #C8341C; stroke-width: 10px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .foot { position: absolute; left: 72px; bottom: 56px; }
  .name { font-weight: 800; font-size: 40px; letter-spacing: -.02em; }
  .name .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: #C8341C; margin-left: 4px; }
  .role { font-family: 'Besley', serif; font-style: italic; font-size: 26px; color: #6A6256; margin-top: 6px; }
  .portrait { position: absolute; right: 72px; bottom: 56px; width: 190px; border: 3px solid #1A1613; box-shadow: 12px 12px 0 #1A1613; background: #C8341C; }
  .portrait img { display: block; width: 100%; height: 232px; object-fit: cover; object-position: 50% 12%; }
</style>
</head>
<body>
  <div class="flag">For local businesses</div>
  <h1>Neighborhood <span class="mark">flyers<svg viewBox="0 0 300 24" preserveAspectRatio="none"><path d="M4 16 C 60 6, 120 4, 180 10 S 270 18, 296 8"/></svg></span><br />that make you happy.</h1>
  <div class="foot">
    <div class="name">Mick Swasko<span class="dot"></span></div>
    <div class="role">Marketing and writing for Lombard, Glen Ellyn &amp; Villa Park</div>
  </div>
  <div class="portrait"><img src="headshot.png" alt="" /></div>
</body>
</html>
