<!doctype html>
<!-- Source for public/og.png, the link-preview card. Rebuild with: npm run og -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Besley:ital,wght@1,400&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #EAE7DE; color: #1A1613;
    font-family: 'Bricolage Grotesque', sans-serif;
    display: grid; grid-template-columns: 1fr 380px; gap: 64px;
    padding: 64px 72px 60px;
    position: relative;
  }
  body::before { content: ''; position: absolute; left: 72px; right: 72px; top: 40px; height: 4px; background: #1A1613; }
  .copy { display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-weight: 700; font-size: 17px; letter-spacing: .16em; text-transform: uppercase; color: #C8341C; }
  h1 { font-weight: 800; font-size: 118px; line-height: .9; letter-spacing: -.045em; margin: 0 0 48px; }
  .mark { position: relative; white-space: nowrap; }
  .mark svg { position: absolute; left: -2%; width: 104%; bottom: -12px; height: 30px; overflow: visible; }
  .mark path { fill: none; stroke: #C8341C; stroke-width: 11px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .stop { color: #1A1613; }
  .name { font-weight: 800; font-size: 40px; letter-spacing: -.02em; }
  .name .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: #C8341C; margin-left: 4px; }
  .role { font-family: 'Besley', serif; font-style: italic; font-size: 27px; color: #6A6256; margin-top: 6px; }
  .portrait { align-self: center; border: 3px solid #1A1613; box-shadow: 18px 18px 0 #1A1613; background: #C8341C; }
  .portrait img { display: block; width: 100%; height: 440px; object-fit: cover; object-position: 50% 12%; }
</style>
</head>
<body>
  <div class="copy">
    <h1>Make it make <span class="mark">sense<svg viewBox="0 0 300 24" preserveAspectRatio="none"><path d="M4 16 C 60 6, 120 4, 180 10 S 270 18, 296 8"/></svg></span><span class="stop">.</span></h1>
    <div class="name">Mick Swasko<span class="dot"></span></div>
    <div class="role">Former Chicago Tribune &amp; RedEye reporter</div>
  </div>
  <div class="portrait"><img src="headshot.jpg" alt="" /></div>
</body>
</html>
